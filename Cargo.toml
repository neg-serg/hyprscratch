[package]
name = "hyprscratch"
version = "0.6.5"
edition = "2021"
license = "MIT"
description = "Improved scratchpad functionality for Hyprland"
homepage = "https://github.com/sashetophizika/hyprscratch"
documentation = "https://docs.rs/crate/hyprscratch"
repository = "https://github.com/sashetophizika/hyprscratch"
readme = "README.md"
keywords = ["linux", "wayland", "hyprland", "scratchpad"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4.38"
hyprland = "0.4.0-beta.3"
notify = "8.1.0"
termsize = "0.1.9"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.clippy]
unit_arg = "allow"
wildcard_imports = "allow"
wrong_self_convention = "allow"
perf = { level = "warn", priority = -1 }

# Hyprland 0.57 dropped the `id` field from special-workspace objects, which
# makes hyprland 0.4.0-beta.3 fail to deserialize `monitors -j` / `clients -j`
# ("missing field `id`") and kills every scratchpad toggle. The last published
# crate is 0.4.0-beta.3, so the fix is vendored: `id` is `#[serde(default)]`.
[patch.crates-io]
hyprland = { path = "vendor/hyprland" }
